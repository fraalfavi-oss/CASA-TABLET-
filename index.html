<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nuestro Hogar · Franklin & Andrea</title>
<style>
:root{--bg:#f3eadc;--card:#fffaf1;--ink:#554434;--muted:#8b7765;--line:#dccab2;--accent:#a35d45;--green:#718268;--shadow:0 8px 24px #6d4f3416}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#ccb99a3b .7px,transparent .7px),var(--bg);background-size:7px 7px;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0 14px;border-bottom:1px solid var(--line)}.brand h1{font:500 30px Georgia,serif;margin:0;color:#724f39}.brand small{color:var(--muted)}.time{text-align:right}.clock{font-size:42px;color:#98664b}.date{color:var(--muted);font-size:13px}.verse{font:italic 17px Georgia,serif;text-align:center;color:#88644e;margin:15px 0}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}h2{font:500 22px Georgia,serif;margin:0 0 12px;color:#724f39}.notes{display:grid;gap:13px}.note{background:#fff0b9;border-radius:4px 8px 16px 4px;padding:17px;min-height:120px;box-shadow:1px 4px 7px #8b6a3320}.note:nth-child(even){background:#f1dcda}.note .meta{font-size:12px;color:#806c58;margin-bottom:7px}.note p{margin:0;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:21px;line-height:1.4}.empty{color:var(--muted);padding:22px 4px}.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed #e5d8c5}.task:last-child{border:0}.task input{width:22px;height:22px;accent-color:var(--green)}.task.done span{text-decoration:line-through;color:#9a8a7b}.agendaItem{padding:10px 0;border-bottom:1px dashed #e5d8c5}.agendaItem:last-child{border:0}.agendaItem strong{display:block}.agendaItem small{color:var(--muted)}.side{display:grid;gap:18px}.qrbox{text-align:center}.qrbox img{width:170px;height:170px;background:#fff;border-radius:10px;border:1px solid var(--line)}.qrbox a{display:inline-block;margin-top:9px;color:var(--accent);font-weight:700;text-decoration:none}.status{margin-top:14px;padding:10px 12px;border-radius:12px;background:#ecefdf;color:#5e704e;font-size:13px}.status.off{background:#f6dfdc;color:#9a4d42}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;border:1px solid var(--line);background:#fffaf1;color:var(--ink);border-radius:11px;padding:10px 12px;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.editor{display:none;margin-top:18px}.editor.open{display:block}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button[aria-pressed=true]{background:#eadacb;border-color:#bb8d70}.field{display:block;margin-top:12px;font-weight:700;font-size:13px}.field textarea,.field input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.field textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manage{margin-top:16px;display:grid;gap:9px}.manageItem{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fffdf8}.manageItem p{margin:5px 0 10px}.manageActions{display:flex;gap:7px;flex-wrap:wrap}.manageActions button{padding:7px 10px}.error{margin-top:10px;color:#a23e32;font-weight:700;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.clock{font-size:34px}.app{padding:13px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <header class="head"><div class="brand"><h1>Nuestro Hogar ♡</h1><small>Franklin & Andrea</small></div><div class="time"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></header>
  <div class="verse">“Todo lo puedo en Cristo que me fortalece.” · Filipenses 4:13</div>
  <section class="grid">
    <div class="panel"><h2>💌 Nuestro tablón</h2><div id="notes" class="notes"></div><div class="toolbar"><button id="prevNote">‹ anterior</button><button id="nextNote">siguiente ›</button><button class="primary" id="toggleEditor">Añadir / editar</button></div></div>
    <div class="side">
      <section class="panel"><h2>✓ Pendientes</h2><div id="tasks"></div></section>
      <section class="panel"><h2>📅 Nuestra agenda</h2><div id="agenda"></div></section>
      <section class="panel qrbox"><h2>Editar desde el móvil</h2><img id="qr" alt="QR del editor"><br><a id="editorLink" href="#">Abrir editor</a><div id="status" class="status">Conectando base central…</div><div id="error" class="error"></div></section>
    </div>
  </section>

  <section class="panel editor" id="editorPanel">
    <h2>Editar Nuestro Hogar</h2>
    <div class="choices" id="authors"><button data-author="Franklin" aria-pressed="true">Franklin</button><button data-author="Andrea" aria-pressed="false">Andrea</button></div>
    <div class="choices" id="kinds" style="margin-top:8px"><button data-kind="note" aria-pressed="true">💌 Mensaje</button><button data-kind="task" aria-pressed="false">✓ Pendiente</button><button data-kind="event" aria-pressed="false">📅 Agenda</button></div>
    <div class="row" id="eventRow" hidden><label class="field">Fecha<input type="date" id="eventDate"></label><label class="field">Hora<input type="time" id="eventTime"></label></div>
    <label class="field">Texto<textarea id="text" maxlength="220" placeholder="Escribe aquí…"></textarea></label>
    <div class="toolbar"><button class="primary" id="save">Guardar</button><button id="cancelEdit" hidden>Cancelar edición</button></div>
    <div id="manage" class="manage"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="sync.js?v=10"></script>
<script>
(()=>{
  const $=s=>document.querySelector(s);let state={items:[]},notePage=0,author='Franklin',kind='note',editId=null;
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const esc=t=>String(t??'');
  function clock(){const d=new Date();$('#clock').textContent=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);$('#date').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(d);}clock();setInterval(clock,1000);
  function visibleNotes(){return state.items.filter(x=>x.kind==='note'&&(!x.noteDate||x.noteDate===today())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));}
  function render(){
    const notes=visibleNotes();notePage=notes.length?Math.min(notePage,notes.length-1):0;$('#notes').innerHTML='';
    if(!notes.length)$('#notes').innerHTML='<div class="empty">Aquí aparecerá vuestro próximo mensaje.</div>';else{const n=notes[notePage];const a=document.createElement('article');a.className='note';a.innerHTML=`<div class="meta">${esc(n.author)} · ${notePage+1}/${notes.length}</div><p></p>`;a.querySelector('p').textContent=n.text;$('#notes').append(a)}
    const tasks=state.items.filter(x=>x.kind==='task').sort((a,b)=>Number(a.done)-Number(b.done)||(a.createdAt||0)-(b.createdAt||0));$('#tasks').innerHTML='';if(!tasks.length)$('#tasks').innerHTML='<div class="empty">Nada pendiente por ahora. ♡</div>';tasks.slice(0,6).forEach(t=>{const l=document.createElement('label');l.className='task'+(t.done?' done':'');const c=document.createElement('input');c.type='checkbox';c.checked=!!t.done;c.onchange=()=>setDone(t.id,c.checked);const s=document.createElement('span');s.textContent=t.text;l.append(c,s);$('#tasks').append(l)});
    const ag=state.items.filter(x=>x.kind==='event'&&x.eventDate>=today()).sort((a,b)=>(a.eventDate+(a.eventTime||'')).localeCompare(b.eventDate+(b.eventTime||'')));$('#agenda').innerHTML='';if(!ag.length)$('#agenda').innerHTML='<div class="empty">No hay nada apuntado.</div>';ag.slice(0,5).forEach(e=>{const d=document.createElement('div');d.className='agendaItem';d.innerHTML='<strong></strong><small></small>';d.querySelector('strong').textContent=e.text;d.querySelector('small').textContent=`${e.eventDate}${e.eventTime?' · '+e.eventTime:''} · ${e.author}`;$('#agenda').append(d)});
    renderManage();
  }
  function renderManage(){const box=$('#manage');box.innerHTML='';state.items.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(x=>{const el=document.createElement('div');el.className='manageItem';const meta=document.createElement('small');meta.textContent=`${x.author} · ${x.kind==='note'?'Mensaje':x.kind==='task'?'Pendiente':'Agenda'}`;const p=document.createElement('p');p.textContent=x.text;const actions=document.createElement('div');actions.className='manageActions';const edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>beginEdit(x);const del=document.createElement('button');del.textContent='Eliminar';del.onclick=()=>removeItem(x.id);actions.append(edit,del);el.append(meta,p,actions);box.append(el)})}
  function setChoice(){document.querySelectorAll('[data-author]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.author===author)));document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));$('#eventRow').hidden=kind!=='event'}
  document.querySelectorAll('[data-author]').forEach(b=>b.onclick=()=>{author=b.dataset.author;setChoice()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;setChoice()});
  $('#prevNote').onclick=()=>{const n=visibleNotes();if(n.length){notePage=(notePage-1+n.length)%n.length;render()}};$('#nextNote').onclick=()=>{const n=visibleNotes();if(n.length){notePage=(notePage+1)%n.length;render()}};$('#toggleEditor').onclick=()=>$('#editorPanel').classList.toggle('open');
  function beginEdit(x){editId=x.id;author=x.author||'Franklin';kind=x.kind;$('#text').value=x.text||'';$('#eventDate').value=x.eventDate||today();$('#eventTime').value=x.eventTime||'';$('#cancelEdit').hidden=false;setChoice();$('#editorPanel').classList.add('open');$('#editorPanel').scrollIntoView({behavior:'smooth'})}
  function resetForm(){editId=null;kind='note';$('#text').value='';$('#eventDate').value=today();$('#eventTime').value='';$('#cancelEdit').hidden=true;setChoice()}
  $('#cancelEdit').onclick=resetForm;
  async function save(){const text=$('#text').value.trim();if(!text)return;$('#save').disabled=true;try{await HogarSync.mutate(db=>{const id=editId||HogarSync.makeId();const prev=db.items[id]||{};db.items[id]={...prev,id,author,kind,text,done:kind==='task'?!!prev.done:false,eventDate:kind==='event'?$('#eventDate').value:'',eventTime:kind==='event'?$('#eventTime').value:'',noteDate:kind==='note'?today():'',createdAt:prev.createdAt||Date.now(),updatedAt:Date.now()}});resetForm()}catch(e){$('#error').textContent=e.message}finally{$('#save').disabled=false}}
  $('#save').onclick=save;
  async function removeItem(id){try{await HogarSync.mutate(db=>{delete db.items[id]})}catch(e){$('#error').textContent=e.message}}
  async function setDone(id,done){try{await HogarSync.mutate(db=>{if(db.items[id]){db.items[id]={...db.items[id],done,updatedAt:Date.now()}}})}catch(e){$('#error').textContent=e.message}}
  HogarSync.subscribe(s=>{state=s;render()});HogarSync.subscribeStatus(s=>{const st=$('#status');if(s.database&&s.realtime){st.textContent='BASE CENTRAL · TIEMPO REAL activo';st.className='status'}else if(s.database){st.textContent='Base central conectada · esperando tiempo real';st.className='status'}else{st.textContent='Conectando base central…';st.className='status off'}if(s.dbUrl){const u=HogarSync.editorUrl();$('#editorLink').href=u;$('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(u)}});
  HogarSync.init().catch(e=>{$('#error').textContent='ERROR DE BASE CENTRAL: '+e.message;$('#status').textContent='SIN BASE CENTRAL';$('#status').className='status off'});resetForm();
})();
</script>
</body></html>
