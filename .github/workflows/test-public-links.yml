name: Test public mirrors

on:
  push:
    paths:
      - ".github/workflows/test-public-links.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check public URLs
        shell: bash
        run: |
          set +e
          urls=(
            "https://raw.githubusercontent.com/fraalfavi-oss/CASA-TABLET-/main/index.html"
            "https://cdn.jsdelivr.net/gh/fraalfavi-oss/CASA-TABLET-@main/index.html"
            "https://cdn.statically.io/gh/fraalfavi-oss/CASA-TABLET-/main/index.html"
            "https://raw.githack.com/fraalfavi-oss/CASA-TABLET-/main/index.html"
            "https://htmlpreview.github.io/?https://github.com/fraalfavi-oss/CASA-TABLET-/blob/main/index.html"
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -L -sS -o /tmp/body -D /tmp/headers -w "HTTP=%{http_code}\nFINAL=%{url_effective}\nTYPE=%{content_type}\n" "$u"
            head -c 120 /tmp/body | tr '\n' ' '; echo
            grep -i '^content-type:' /tmp/headers | tail -1
            echo
          done
