name: Verify public host

on:
  push:
    paths:
      - ".github/workflows/verify-host.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Statically
        shell: bash
        run: |
          set -e
          URL='https://cdn.statically.io/gh/fraalfavi-oss/CASA-TABLET-@main/index.html'
          curl -sS -D /tmp/h -o /tmp/b "$URL"
          cat /tmp/h
          echo "---- FIRST BYTES ----"
          head -c 120 /tmp/b
          echo
          grep -qi '^content-type: text/html' /tmp/h
          grep -qi '<!doctype html>' /tmp/b
