name: Publicar Nuestro Hogar anonimo

on:
  push:
    paths:
      - ".github/workflows/publicar-anonimo.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar HTML
        shell: bash
        run: |
          set -e
          echo "PUBLICANDO..."
          curl --fail --show-error --silent --max-time 60 \
            -X POST "https://api.display.dev/v1/public/artifacts" \
            -F "file=@index.html" \
            -o response.json
          echo "RESPUESTA:"
          cat response.json
