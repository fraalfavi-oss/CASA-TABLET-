name: Verify shared storage browser access

on:
  push:
    paths:
      - ".github/workflows/verify-sync.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS
        shell: bash
        run: |
          set -e
          URL="https://superjsonblob.com/api/jsonBlob/b98cc63a-d350-40ee-976b-607ba8c67e9e"
          echo "---- GET WITH ORIGIN ----"
          curl -sS -D - -o /dev/null "$URL" -H "Origin: https://htmlpreview.github.io"
          echo "---- OPTIONS PUT ----"
          curl -sS -D - -o /dev/null -X OPTIONS "$URL" \
            -H "Origin: https://htmlpreview.github.io" \
            -H "Access-Control-Request-Method: PUT" \
            -H "Access-Control-Request-Headers: content-type"
