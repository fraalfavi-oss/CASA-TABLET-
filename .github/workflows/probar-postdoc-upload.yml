name: Probar publicacion permanente directa

on:
  push:
    paths:
      - ".github/workflows/probar-postdoc-upload.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POST HTML directly
        shell: bash
        run: |
          set +e
          curl -i -sS -L -X POST "https://www.lasca.ai/api/upload" \
            -F "html=@index.html;type=text/html" \
            -F "slug=nuestro-hogar-franklin-andrea" \
            -o /tmp/resp.txt
          cat /tmp/resp.txt
