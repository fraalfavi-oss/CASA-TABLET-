name: Investigar hosting permanente

on:
  push:
    paths:
      - ".github/workflows/investigar-postdoc.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Postdoc web publisher
        shell: bash
        run: |
          set -e
          curl -L -sS https://www.lasca.ai/try -o /tmp/page.html
          echo "=== PAGE FORMS/API HINTS ==="
          grep -Eo 'https?://[^"'\'' ]+|/[^"'\'' ]*(api|publish|upload)[^"'\'' ]*|src="[^"]+"' /tmp/page.html | head -200 || true
          echo "=== SCRIPTS ==="
          grep -Eo 'src="[^"]+\.js[^"]*"' /tmp/page.html | sed 's/^src="//;s/"$//' > /tmp/scripts.txt || true
          cat /tmp/scripts.txt
          while read -r s; do
            [ -z "$s" ] && continue
            case "$s" in
              http*) u="$s" ;;
              /*) u="https://www.lasca.ai$s" ;;
              *) u="https://www.lasca.ai/$s" ;;
            esac
            echo "=== $u ==="
            curl -L -sS "$u" | grep -Eo '.{0,120}(api|publish|upload|fetch\().{0,220}' | head -80 || true
          done < /tmp/scripts.txt
