name: Verificar HTMLPreview

on:
  push:
    paths:
      - ".github/workflows/verificar-htmlpreview.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTMLPreview
        shell: bash
        run: |
          set +e
          u="https://htmlpreview.github.io/?https://github.com/fraalfavi-oss/CASA-TABLET-/blob/main/index.html"
          curl --max-time 15 -L -sS -D /tmp/h -o /tmp/b -w "HTTP=%{http_code}\nTYPE=%{content_type}\nFINAL=%{url_effective}\n" "$u"
          echo "HEADERS"
          grep -Ei '^(content-type|location):' /tmp/h | tail -10 || true
          echo "BODY"
          head -c 500 /tmp/b
