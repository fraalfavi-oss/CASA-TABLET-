name: Verificar CDN permanente

on:
  push:
    paths:
      - ".github/workflows/verificar-cdn.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check CDN rendering headers
        shell: bash
        run: |
          set +e
          for u in             "https://cdn.jsdelivr.net/gh/fraalfavi-oss/CASA-TABLET-@main/index.html"             "https://cdn.statically.io/gh/fraalfavi-oss/CASA-TABLET-/main/index.html"             "https://raw.githubusercontent.com/fraalfavi-oss/CASA-TABLET-/main/index.html"
          do
            echo "=== $u ==="
            curl --max-time 12 -L -sS -D /tmp/h -o /tmp/b -w "HTTP=%{http_code} TYPE=%{content_type} FINAL=%{url_effective}\n" "$u"
            grep -i '^content-type:' /tmp/h | tail -1 || true
            head -c 80 /tmp/b | tr '\n' ' '; echo
          done
