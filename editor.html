<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Editor · Nuestro Hogar</title>
<style>
:root{--bg:#f3eadc;--card:#fffaf1;--ink:#554434;--muted:#8b7765;--line:#dccab2;--accent:#a35d45;--green:#718268}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:700px;margin:auto;padding:14px}.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px}.hero h1{font:500 28px Georgia,serif;margin:0;color:#724f39}.hero p{color:var(--muted);margin:6px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices.three{grid-template-columns:repeat(3,1fr)}button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:46px;padding:9px;cursor:pointer}.choices button[aria-pressed=true]{background:#eadacb;border-color:#bb8d70}.field{display:block;margin-top:12px;font-weight:700;font-size:13px}.field textarea,.field input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.field textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;margin-top:12px;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800}.status{margin-top:10px;border-radius:12px;padding:10px 12px;background:#ecefdf;color:#5e704e;font-size:13px}.status.off{background:#f6dfdc;color:#9a4d42}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.item small{color:var(--muted)}.item p{margin:6px 0 10px;white-space:pre-wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{min-height:36px;padding:7px 10px}.error{color:#a23e32;font-weight:700;font-size:13px;margin-top:8px}@media(max-width:430px){.app{padding:10px}.choices.three{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head><body>
<main class="app">
<section class="hero"><h1>Editar Nuestro Hogar ♡</h1><p>Todo lo que guardes aquí debe aparecer también en la tablet.</p><div id="status" class="status">Conectando base central…</div><div id="error" class="error"></div></section>
<section class="card"><div class="choices"><button data-author="Franklin" aria-pressed="true">Franklin</button><button data-author="Andrea" aria-pressed="false">Andrea</button></div><div class="choices three" style="margin-top:8px"><button data-kind="note" aria-pressed="true">💌 Mensaje</button><button data-kind="task" aria-pressed="false">✓ Pendiente</button><button data-kind="event" aria-pressed="false">📅 Agenda</button></div><div id="eventRow" class="row" hidden><label class="field">Fecha<input id="eventDate" type="date"></label><label class="field">Hora<input id="eventTime" type="time"></label></div><label class="field">Texto<textarea id="text" maxlength="220" placeholder="Escribe aquí…"></textarea></label><button id="save" class="save">Guardar</button><button id="cancel" hidden style="width:100%;margin-top:8px">Cancelar edición</button></section>
<section class="card"><h2 style="font:500 21px Georgia,serif;margin:0 0 10px;color:#724f39">Todo lo compartido</h2><div id="list" class="list"></div></section>
</main>
<script src="sync.js?v=8"></script>
<script>
(()=>{const $=s=>document.querySelector(s);let state={items:[]},author='Franklin',kind='note',editId=null;const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function choice(){document.querySelectorAll('[data-author]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.author===author)));document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));$('#eventRow').hidden=kind!=='event'}document.querySelectorAll('[data-author]').forEach(b=>b.onclick=()=>{author=b.dataset.author;choice()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;choice()});function render(){const box=$('#list');box.innerHTML='';state.items.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(x=>{const el=document.createElement('article');el.className='item';const meta=document.createElement('small');meta.textContent=`${x.author} · ${x.kind==='note'?'Mensaje':x.kind==='task'?(x.done?'Pendiente hecho':'Pendiente'):'Agenda'}`;const p=document.createElement('p');p.textContent=x.text;const a=document.createElement('div');a.className='actions';const e=document.createElement('button');e.textContent='Editar';e.onclick=()=>edit(x);const d=document.createElement('button');d.textContent='Eliminar';d.onclick=()=>remove(x.id);a.append(e);if(x.kind==='task'){const t=document.createElement('button');t.textContent=x.done?'Volver a pendiente':'Marcar hecho';t.onclick=()=>done(x.id,!x.done);a.append(t)}a.append(d);el.append(meta,p,a);box.append(el)});if(!state.items.length)box.innerHTML='<div style="color:#8b7765;padding:12px">Todavía no hay nada compartido.</div>'}function edit(x){editId=x.id;author=x.author||'Franklin';kind=x.kind;$('#text').value=x.text||'';$('#eventDate').value=x.eventDate||today();$('#eventTime').value=x.eventTime||'';$('#cancel').hidden=false;choice();window.scrollTo({top:0,behavior:'smooth'})}function reset(){editId=null;kind='note';$('#text').value='';$('#eventDate').value=today();$('#eventTime').value='';$('#cancel').hidden=true;choice()}$('#cancel').onclick=reset;$('#save').onclick=async()=>{const text=$('#text').value.trim();if(!text)return;$('#save').disabled=true;$('#error').textContent='';try{await HogarSync.mutate(db=>{const id=editId||HogarSync.makeId(),prev=db.items[id]||{};db.items[id]={...prev,id,author,kind,text,done:kind==='task'?!!prev.done:false,eventDate:kind==='event'?$('#eventDate').value:'',eventTime:kind==='event'?$('#eventTime').value:'',noteDate:kind==='note'?today():'',createdAt:prev.createdAt||Date.now(),updatedAt:Date.now()}});reset()}catch(e){$('#error').textContent=e.message}finally{$('#save').disabled=false}};async function remove(id){try{await HogarSync.mutate(db=>{delete db.items[id]})}catch(e){$('#error').textContent=e.message}}async function done(id,v){try{await HogarSync.mutate(db=>{if(db.items[id])db.items[id]={...db.items[id],done:v,updatedAt:Date.now()}})}catch(e){$('#error').textContent=e.message}}HogarSync.subscribe(s=>{state=s;render()});HogarSync.subscribeStatus(s=>{const st=$('#status');if(s.database&&s.realtime){st.textContent='BASE CENTRAL · TIEMPO REAL activo';st.className='status'}else if(s.database){st.textContent='Base central conectada · esperando tiempo real';st.className='status'}else{st.textContent='Conectando base central…';st.className='status off'}});HogarSync.init({allowCreate:false}).catch(e=>{$('#error').textContent='ERROR DE BASE CENTRAL: '+e.message;$('#status').textContent='SIN BASE CENTRAL';$('#status').className='status off'});reset()})();
</script>
</body></html>
